<svg class="model-illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 625" role="img" aria-labelledby="modeloverview-title modeloverview-desc"><title id="modeloverview-title">Transformer gốc: 6 Encoder và 6 Decoder</title><desc id="modeloverview-desc">Dữ liệu đi từ dưới lên. Câu nguồn được embedding, cộng thông tin vị trí, rồi đi qua 6 Encoder. Đầu ra Encoder cung cấp ngữ cảnh cho từng lớp trong 6 Decoder. Decoder nhận các token đích trước đó để dự đoán token tiếp theo. Các đường này thể hiện luồng thông tin ở mức tổng quan.</desc><defs><marker id="modeloverview-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a3afb6"/></marker></defs><rect width="620" height="625" fill="#fff"/><text x="36" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="26.45" fill="#79a860" text-anchor="start" >Encoder</text><text x="364" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="26.45" fill="#c5965c" text-anchor="start" >Decoder</text><text x="256" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16.099999999999998" fill="#85909a" text-anchor="end" >6 lớp</text><text x="584" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16.099999999999998" fill="#85909a" text-anchor="end" >6 lớp</text><g id="encoder-stack" class="overview-stack overview-encoder"><rect class="overview-layer" x="36" y="184" width="220" height="31" rx="5" fill="#edf5e6" stroke="#a9c98d"/><text x="146" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="20.7" fill="#709655" text-anchor="middle" >Encoder 6</text><rect class="overview-layer" x="36" y="225" width="220" height="31" rx="5" fill="#edf5e6" stroke="#a9c98d"/><text x="146" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="20.7" fill="#709655" text-anchor="middle" >Encoder 5</text><rect class="overview-layer" x="36" y="266" width="220" height="31" rx="5" fill="#edf5e6" stroke="#a9c98d"/><text x="146" y="288" font-family="Segoe UI,Arial,sans